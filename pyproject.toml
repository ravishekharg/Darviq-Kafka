[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]  # black owns line length

[tool.black]
line-length = 110
target-version = ["py312"]
extend-exclude = "data/"

[tool.pytest.ini_options]
testpaths = ["tests"]
